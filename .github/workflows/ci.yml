name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host emulator tests (${{ matrix.cxx }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v7
      - name: Configure with ASan and UBSan
        run: cmake -S firmware -B build-host -DSPECCY_HOST=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - name: Build
        run: cmake --build build-host --parallel
      - name: Run CTest suites
        run: ctest --test-dir build-host --output-on-failure
      - name: Render the diagnostic frame
        run: |
          build-host/speccy-host --rom build-host/content/spectrum48.rom --snapshot build-host/content/game48.sna \
            --frames 50 --buttons 9 --output build-host/frame.ppm
          python3 firmware/tools/ppm_to_png.py build-host/frame.ppm build-host/frame.png --scale 4
      - uses: actions/upload-artifact@v7
        if: matrix.cxx == 'g++'
        with:
          name: diagnostic-frame
          path: build-host/frame.png

  esp32:
    name: ESP32 firmware (ESP-IDF v5.4.4)
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.4.4
    defaults:
      run:
        shell: bash
        working-directory: firmware
    steps:
      - uses: actions/checkout@v7
      - name: Build the diagnostic image
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B build-esp32 build
          idf.py -B build-esp32 size
      - uses: actions/upload-artifact@v7
        with:
          name: speccy-micro-diagnostic-esp32
          path: |
            firmware/build-esp32/bootloader/bootloader.bin
            firmware/build-esp32/partition_table/partition-table.bin
            firmware/build-esp32/speccy_micro.bin
            firmware/build-esp32/flash_args

  checks:
    name: Electrical and documentation checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check stored netlists, BOMs and reports
        run: python3 hardware/electronics/check.py
      - name: Check Markdown links and anchors
        run: python3 docs/check_links.py
      - name: Build the CAD package
        run: python3 hardware/cad/scripts/package.py
